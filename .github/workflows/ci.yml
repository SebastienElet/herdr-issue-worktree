name: Checks and publication
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        os: [macos-26, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.98.1 --profile minimal --component clippy --component rustfmt
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - run: cargo check --workspace --all-targets --all-features --locked
      - run: cargo test --workspace --all-features --locked
      - run: cargo doc --workspace --all-features --no-deps --locked
        env:
          RUSTDOCFLAGS: -Dwarnings
  typescript:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun test
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [rust, typescript]
    runs-on: macos-26
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: rustup toolchain install 1.98.1 --profile minimal
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run build
      - run: bun pm pack --ignore-scripts
        working-directory: packages/darwin-arm64
      - run: bun pm pack --ignore-scripts
      - run: npm publish ./packages/darwin-arm64/sebastienelet-herdr-issue-worktree-darwin-arm64-1.0.0.tgz --provenance --access public --registry https://registry.npmjs.org --ignore-scripts
      - run: npm publish ./sebastienelet-herdr-issue-worktree-1.0.0.tgz --provenance --access public --registry https://registry.npmjs.org --ignore-scripts
